const T = []
function iris(at, color, fromX, fromY, toX, toY) {
  const e = el('div', 'wipe', wipes)
  css(e, { background: color })
  const R = (x, y) => Math.hypot(Math.max(x, W - x), Math.max(y, H - y))
  T.push({ at, update(t) {
    const a = p(t, at - 0.45, at, E.io3), b = p(t, at, at + 0.5, E.io3)
    if (t < at - 0.45 || t > at + 0.5) { e.style.visibility = 'hidden'; return }
    e.style.visibility = 'visible'
    if (t < at) css(e, { clipPath: `circle(${a * R(fromX, fromY)}px at ${fromX}px ${fromY}px)` })
    else css(e, { clipPath: `circle(${(1 - b) * R(toX, toY)}px at ${toX}px ${toY}px)` })
  } })
}
function bars(at, color) {
  const n = 7
  const bs = Array.from({ length: n }, (_, i) => { const b = el('div', 'bar-w', wipes); css(b, { left: `${i * W / n}px`, width: `${W / n + 1}px`, background: i % 2 ? color : '#0e2733' }); return b })
  T.push({ at, update(t) {
    bs.forEach((b, i) => {
      const d = i * 0.035
      const a = p(t, at - 0.5 + d, at - 0.02 + d * 0.3, E.io5), c = p(t, at + d * 0.5, at + 0.5 + d, E.io5)
      const vis = t > at - 0.5 && t < at + 0.8
      css(b, { visibility: vis ? 'visible' : 'hidden', transform: `translateY(${t < at ? (1 - a) * 100 : -c * 100}%)` })
    })
  } })
}
function slide(at, color) {
  const e = el('div', 'wipe', wipes)
  css(e, { background: `linear-gradient(90deg, ${color} 0%, ${color} 92%, #5fe3c0 92%, #5fe3c0 100%)` })
  T.push({ at, update(t) {
    const a = p(t, at - 0.45, at, E.io5), b = p(t, at, at + 0.5, E.io5)
    if (t < at - 0.45 || t > at + 0.5) { e.style.visibility = 'hidden'; return }
    e.style.visibility = 'visible'
    css(e, { transform: t < at ? `translateX(${(a - 1) * 100}%)` : `translateX(${b * 110}%)` })
  } })
}
